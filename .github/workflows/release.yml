name: Release

# Beim Veröffentlichen eines Tags (z. B. v0.2.0) entstehen Docker-Images auf ghcr.io und ein GitHub-Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name in Kleinbuchstaben
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/lodestone-panel:latest
            ghcr.io/${{ env.OWNER }}/lodestone-panel:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/lodestone-node:latest
            ghcr.io/${{ env.OWNER }}/lodestone-node:${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deploy/docker-compose.release.yml
            .env.example